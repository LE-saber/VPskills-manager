name: Validate Skill Registry

on:
  push:
    paths:
      - "registry/**"
      - "schemas/**"
      - "skills/**"
      - "scripts/validate_registry.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "registry/**"
      - "schemas/**"
      - "skills/**"
      - "scripts/validate_registry.py"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate registry and Skill paths
        run: python scripts/validate_registry.py
